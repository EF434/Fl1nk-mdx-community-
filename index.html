    <!DOCTYPE html>
    <html lang="en">
    <head>
        <!-- Meta Declarations for the Home page-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Provide the title name-->
        <title>V1sionOS</title>
        <!-- Add a favicon and link external CSS file-->
        <link rel="icon" href="assets/images/favicon.png" type="image/png">
        <link rel="stylesheet" href="css/style.css">
    
    </head>
    <body>

    <div id="home-view">
        <header class="page-header">
        <div class="header-items">
            <a class="fl1nk-logo" href="#home">
            <img src="assets/images/favicon.png" alt="FL1NK logo">
            
            </a>

            <div class="account-controls">
            <div id="logged-in-user" hidden>
                <button class="profile-button" type="button">
                <img id="user-pic" src="assets/images/default_pic.png" alt="">
                <span id="username"></span>
                </button>
            </div>

            <button id="login-register-page" type="button">Login / Register</button>

            </div>
            
        </div>

        </header>

        <nav class="navbar-links">
            <button id="nav-home" class="active" type="button">Home</button>
            <button  id="nav-feed" type="button">Feed</button>
            <button  id="nav-program" type="button">Program</button>
            <button  id="nav-create-post" type="button">Create post</button>
        </nav>


        <main>
        <section id="home" class="page">
            <div class="hero-banner">
                <div class="banner-content">
                    <a class="fl1nk-img"><img src="assets/images/logo-image.png" alt="Fl1nk Logo"></a>
                    <a class="mdx-img"><img src="assets/images/mdx-logo.png" alt="Fl1nk Logo"></a>
                    <h1>Find your people at MDX</h1>
                    <h2> Explore courses, meet classmates <br>and join the conversation!</h2>
                </div>
                <a class="effect-img"><img src="assets/images/effect.png" alt="Fl1nk Logo"></a>

                <div class="community-cards">
                    <div class="community-card">
                    <img src="assets/images/discover.png" alt="Discover Communities Image">
                    <h3> Discover <br> communities</h3>
                    </div>

                    <div class="community-card">
                    <img src="assets/images/classmates.png" alt="Discover Communities Image">
                    <h3> Find <br> classmates</h3>
                    </div>

                    <div class="community-card">
                    <img src="assets/images/events.png" alt="Discover Communities Image">
                    <h3> See what's <br> happening</h3>
                    </div>
                </div>
                <div class="banner-buttons">
                    <button class ="button-1" onclick="switch_page('program')" alt="Find Classmates button"> Find Classmates</button>
                    <button class ="button-2" onclick="switch_page('feed')" alt="Explore Feed"> Explore More</button>
                </div>
            </div>
        </section>            
        

        <section id="feed" class="page">
            <h1> Feed </h1>

        </section>

        <section id="program" class="page">
            <h1> Program </h1>

        </section>

        <section id="create-post" class="page">

            <h1> Create post </h1>

        </section>
        </main>
        </div>
        <section class="login-register-page" id="auth-page" hidden>
            <button id="back-home" type="button"> 🏠︎ Back Home</button>
            <canvas id="fl1nk-mascot" width="362" height="500"></canvas>



            <div class="main-section">
            <!-- Create a checkbox for dynamic feature-->
            <input type="checkbox" id="checkbox">
            <div class="login-register-tabs">
                <button type="button" id="show-signup" >Register</button>
                <button type="button" id="show-login">Login</button>
            </div>
            <div class="signup">

                <!-- Add Signup heading-->
                <form>
                    <!-- Profile Picture -->
                    <div class="upload-picture">
                        <label for="profile-image" class="profile-pic-circle" id="profile-circle">
                            <img id="profile-pic"  src="../assets/images/profile_image.webp" alt="User Profile Picture">
                            <span id="plus-icon">+</span>
                        </label>

                        <input type="file" id="profile-image" accept="image/*" required>
                        <p class="error-message" id="profile-pic-error"></p>
                    </div>

                    <!-- Add Fist name heading-->
                    <div>
                        <label>Full Name</label>
                        <input type="text" placeholder="Emaan Fatima" id="fullname" required="">
                        <p class="error-message" id="user-name-error"></p>
                    </div>

                    <!-- Add Username heading-->
                    <div>
                        <label>Username</label>
                        <input type="text" placeholder="emaans101" id="register-username" required="">
                        <p class="error-message" id="username-error"></p>
                    </div>

                    <!-- Add Emial heading-->
                    <div>
                        <label>Email</label>
                        <input type="email" id="email" placeholder="emaanedu.hw@gmail.com" required="">
                        <p class="error-message" id="email-error"></p>
                    </div>

                    <!-- Add Fist name heading-->
                    <div>
                        <label>Password</label>
                        <div class="login-password-eye">
                            <input type="password" id="password" placeholder="Password" required="">
                            <ion-icon name="eye-outline" class="eye-icon" onclick="showPassword(this, 'password')"></ion-icon>
                        </div>
                        <p class="error-message" id="password-error"></p>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label>Re-enter Password</label>
                        <div class="login-password-eye">
                            <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                            <ion-icon class="eye-icon" name="eye-outline" onclick="showPassword(this, 'confirm-password')"></ion-icon>
                        </div>
                        <p class="error-message" id="confirm-password-error"></p>
                    </div>

                    <!-- Date of Birth -->
                    <div>
                        <label>Date of Birth</label>
                        <input type="date" id="user_dob" required>
                        <p class="error-message" id="dob-error"></p>
                    </div>

                    <!-- Add Phone Number -->
                    <div>
                        <label>Contact Number</label>
                        <input type="tel" id="phone-number" placeholder="+971 00 000 000" required="">
                        <p class="error-message" id="number-error"></p>
                    </div>

                    <!-- Sign Up button -->
                    <p id="success-message"></p>
                    <button type="button" onclick="processInput()">Sign up</button>
                </form>
            </div>

            <div class="login">
                <form>
                    
                    <!-- Add email-->
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Email" required>

                    <!-- Add password-->
                    <label>Password</label>
                    <div class="login-password-eye">
                        <input type="password" id="login-password" placeholder="Password" required>
                        <ion-icon name="eye-outline" id="eye-icon" onclick="showPassword(this, 'login-password')"></ion-icon>
                    </div>

                    <!-- submit-->
                    <p class="feedback-message" id="loginFeedback"></p>
                    <button type="button" onclick="login()">Login</button>
                </form>
            </div>
        </div>
    </main>

        </section>


    
    <!-- Adding external icons for footer in javascript-->
    <script
     type="module" 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js">
    </script>
    <script
     nomodule 
     src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js">
    </script>

    <script src="js/page_navigation.js"> </script>
    <script src="js/fl1nk_animation.js"></script>



    </body>
    </html>
